# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx3G

# NeoForge Properties
	# check these on https://projects.neoforged.net/neoforged/neoforge
	minecraft_version=26.3
	minecraft_version_dependency=26.3
	minecraft_version_list=26.3
	minecraft_version_list_presentable=26.3
	neoforge_version=26.3.0.51-beta
	moddev_gradle_version=2.0.148

# Mod Properties
	version=2.16.2-neoforge
	group=net.earthcomputer
	archives_base_name=clientcommands

# Dependencies
	# Library versions Minecraft 26.3's own sources are written against. Build-tool dependencies of
	# NeoForm drag in older releases (fastutil 8.3.1 via DiffPatch, gson 2.10.1) that land on the same
	# recompile classpath and shadow the correct ones, so they are pinned rather than inherited.
	# See the guard in build.gradle.
	fastutil_version=8.5.18
	gson_version=2.14.0

	# Forgified Fabric API: Sinytra's NeoForge port of the Fabric API. Supplies the
	# FabricClientCommandSource implementation on top of NeoForge's ClientCommandSourceStack.
	# These track Minecraft 26.1.2 upstream; that is what the NeoForge-side ports publish, and the
	# reference NeoForge port of this mod pairs them with a newer NeoForge the same way.
	forgified_loader_version=2.5.83+0.19.3+26.1.2
	ffapi_api_base=2.0.3+b11575294c
	ffapi_command_api_v2=3.0.5+7f229b4b4c

	clientarguments_version=1.14.0
	betterconfig_version=2.9.0
	simplewaypoints_version=1.5.1
	seedfinding_core_version=1.210.0
	seedfinding_biome_version=1.171.1
	seedfinding_feature_version=1.171.11
	seedfinding_seed_version=1.171.2
	latticg_version=1.07
	devauth_version=1.2.2
	checkstyle_version=11.0.0

	jazzer_junit_version=0.24.0
	junit_version=5.13.4
